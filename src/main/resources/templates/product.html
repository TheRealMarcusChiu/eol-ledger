<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${product.label()} + ' releases')}"></head>
<body>
<header th:replace="~{fragments :: nav('dashboard')}"></header>
<main id="main">
    <div class="page-head">
        <p class="crumbs"><a th:href="@{/}">EoL Dependencies</a> / <span th:text="${product.label()}">Python</span></p>
        <h1 th:text="${product.label()}">Python</h1>
        <p class="lede"><a th:if="${product.link()}" th:href="${product.link()}" th:text="${product.link()}">link</a>
            <span th:unless="${product.link()}" th:text="'endoflife.date product ' + ${product.name()}">name</span>,
            synced <span th:text="${@view.time(product.syncedAt())}">time</span></p>
    </div>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Release cycles">
        <table id="release-cycles-table" data-preference-key="release cycles">
            <thead>
            <tr>
                <th scope="col" data-type="version">Cycle</th>
                <th scope="col" data-type="version">Latest patch</th>
                <th scope="col" data-type="date">Released</th>
                <th scope="col" data-type="date">EoL date</th>
                <th scope="col">Status</th>
                <th scope="col" data-type="number" class="num"># Code Repos Using It</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${cycles}" th:with="href=@{/dependencies/{p}(p=${product.name()},version=${c.name()})}" th:attr="data-href=${href}">
                <td><a th:href="${href}" th:text="${c.label() ?: c.name()}">3.10</a></td>
                <td data-value="" th:attrappend="data-value=${c.latest()}" th:text="${c.latest() ?: 'Unknown'}">3.10.19</td>
                <td class="date" data-value="" th:attrappend="data-value=${c.releaseDate()}" th:text="${c.releaseDate() ?: 'Unknown'}">2021-10-04</td>
                <td class="date" data-value="" th:attrappend="data-value=${c.eolFrom()}" th:text="${c.eolFrom() ?: 'Not published'}">2026-10-31</td>
                <td th:insert="~{fragments :: eol(${eols.get(c.name())})}"></td>
                <td class="num" th:text="${repoCounts.getOrDefault(c.name(), 0)}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
