<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${b.repoName()} + ' @ ' + ${b.branch()})}"></head>
<body>
<header th:replace="~{fragments :: nav('repos')}"></header>
<main id="main">
    <div class="page-head">
        <p class="crumbs"><a th:href="@{/repos}">Repositories</a> / <span th:text="${b.repoName()}">repo</span></p>
        <h1><span th:text="${b.repoName()}">repo</span> <span class="muted">@</span> <span th:text="${b.branch()}">main</span></h1>
    </div>
    <section class="panel">
        <dl class="facts">
            <dt>Repository</dt>
            <dd><a th:if="${b.repoLink()}" th:href="${b.repoLink()}" th:text="${b.repoUrl()}" rel="noopener noreferrer">url</a>
                <span th:unless="${b.repoLink()}" th:text="${b.repoUrl()}">url</span>
                <span class="muted" th:text="'(' + ${b.provider()} + ')'">(gitlab)</span></dd>
            <dt>Branch</dt>
            <dd><code th:text="${b.branch()}">main</code></dd>
            <dt>SBOM</dt>
            <dd><a th:if="${b.sbomLink()}" th:href="${b.sbomLink()}" th:text="${b.sbomUrl()}" rel="noopener noreferrer">sbom</a>
                <span th:unless="${b.sbomLink()}"><code th:text="${b.sbomUrl()}">classpath:samples/x</code>
                    <span class="muted" th:if="${b.sbomUrl().startsWith('classpath:')}">(bundled demo sample)</span></span></dd>
            <dt>Latest snapshot</dt>
            <dd><span th:text="${b.observedAt() != null} ? ${@view.time(b.observedAt())} : 'No snapshot yet'">time</span>
                <a th:href="@{/repos/{id}/history(id=${b.id()})}">View history</a></dd>
        </dl>
    </section>
    <h2>Dependencies in the latest snapshot</h2>
    <div th:replace="~{fragments :: depsTable(${deps}, ${b.id()}, ${b.repoUrl()}, ${b.repoLink()}, ${b.sbomUrl()}, ${b.sbomLink()})}"></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
