<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${b.repoName()} + ' @ ' + ${b.branch()})}"></head>
<body>
<header th:replace="~{fragments :: nav('repos')}"></header>
<main id="main">
    <div class="page-head">
        <p class="crumbs"><a th:href="@{/repos}">Code repos</a> / <span th:text="${b.repoName()}">repo</span></p>
        <div class="title-row">
            <h1><span th:text="${b.repoName()}">repo</span> <span class="muted">@</span> <span th:text="${b.branch()}">main</span></h1>
            <a class="button-quiet" th:href="@{/repos/{id}/history(id=${b.id()})}">View history</a>
        </div>
    </div>
    <section class="panel">
        <dl class="facts">
            <dt>Code repo</dt>
            <dd><a th:if="${b.repoLink()}" th:href="${b.repoLink()}" th:text="${b.repoUrl()}" rel="noopener noreferrer">url</a>
                <span th:unless="${b.repoLink()}" th:text="${b.repoUrl()}">url</span>
                <span class="muted" th:text="'(' + ${b.provider()} + ')'">(gitlab)</span></dd>
            <dt>Branch</dt>
            <dd><code th:text="${b.branch()}">main</code></dd>
            <dt>SBOM</dt>
            <dd th:if="${b.sbomUrl() == T(dev.eolledger.ImportService).INLINE}">Inline JSON upload <span class="muted">(nothing fetched)</span></dd>
            <dd th:unless="${b.sbomUrl() == T(dev.eolledger.ImportService).INLINE}"><a th:if="${b.sbomLink()}" th:href="${b.sbomLink()}" th:text="${b.sbomUrl()}" rel="noopener noreferrer">sbom</a>
                <code th:unless="${b.sbomLink()}" th:text="${b.sbomUrl()}">sbom</code></dd>
            <dt>Latest snapshot</dt>
            <dd th:text="${b.observedAt() != null} ? ${@view.time(b.observedAt())} : 'No snapshot yet'">time</dd>
        </dl>
        <th:block th:if="${inline != null}"><dl th:replace="~{fragments :: inlineFacts(${inline})}"></dl></th:block>
    </section>
    <h2>Latest dependencies</h2>
    <div th:replace="~{fragments :: depsTable(${deps}, ${b.id()}, ${b.repoUrl()}, ${b.repoLink()}, ${b.sbomUrl()}, ${b.sbomLink()})}"></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
