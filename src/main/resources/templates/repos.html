<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Code repos')}"></head>
<body>
<header th:replace="~{fragments :: nav('repos')}"></header>
<main id="main">
    <div class="page-head">
        <h1>Code repos</h1>
    </div>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Code repo branches">
        <!--/* data-preference-index keeps each column's original position, so saved URL filters, order and widths stay with the same column. */-->
        <table id="code-repos-table">
            <thead>
            <tr>
                <th scope="col" data-preference-index="0">App ID</th>
                <th scope="col" data-preference-index="1">Code repo</th>
                <th scope="col" data-preference-index="2">Branch</th>
                <th scope="col" data-preference-index="6" data-type="version">Version</th>
                <th scope="col" data-preference-index="3">Provider</th>
                <th scope="col" data-preference-index="7">SBOM Format</th>
                <th scope="col" data-preference-index="4" data-type="number" class="num">Packages</th>
                <th scope="col" data-preference-index="5" data-type="datetime">Latest snapshot</th>
            </tr>
            </thead>
            <tbody>
            <!--/* The whole row opens the branch (app.js, mouse and Enter); the repo URL is a separate external link. */-->
            <tr th:each="b : ${branches}" th:with="href=@{/repos/{id}(id=${b.id()})},f=${facts.get(b.id())}" th:attr="data-href=${href}">
                <td data-column="appid" th:text="${f.appId() ?: '—'}">APP-1</td>
                <td data-column="repo" class="col-source"><a th:if="${b.repoLink()}" th:href="${b.repoLink()}" th:text="${b.repoUrl()}"
                        rel="noopener noreferrer">url</a><span th:unless="${b.repoLink()}" th:text="${b.repoUrl()}">url</span></td>
                <td data-column="branch"><span th:text="${b.branch()}">main</span>
                    <noscript><a th:href="${href}">Details</a></noscript></td>
                <td data-column="version" th:text="${f.version() ?: '—'}">1.2.3</td>
                <td data-column="provider" th:text="${b.provider()}">gitlab</td>
                <td data-column="format" th:text="${f.format() ?: '—'}">CycloneDX 1.6 JSON</td>
                <td data-column="packages" class="num" th:text="${b.depCount()}">5</td>
                <td data-column="snapshot" class="date small" th:with="seen=${@view.time(b.observedAt())}" th:data-value="${seen}" th:text="${b.observedAt() != null} ? ${seen} : 'No snapshot yet'">time</td>
            </tr>
            <tr th:if="${branches.isEmpty()}">
                <td colspan="8" class="empty">No code repos yet. <a th:href="@{/imports}">Upload a dependency-inventory JSON</a>.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
