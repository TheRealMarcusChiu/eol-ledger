<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Code repos')}"></head>
<body>
<header th:replace="~{fragments :: nav('repos')}"></header>
<main id="main">
    <div class="page-head" data-eyebrow="the archive · branches under watch">
        <h1>Code repos</h1>
        <p class="lede"><span th:text="${repoCount}">3</span> code repos, <span th:text="${branches.size()}">4</span> branches</p>
    </div>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Code repo branches">
        <table id="code-repos-table">
            <thead>
            <tr>
                <th scope="col">App ID</th>
                <th scope="col">Code repo</th>
                <th scope="col">Branch</th>
                <th scope="col">Provider</th>
                <th scope="col" data-type="number" class="num">Packages</th>
                <th scope="col" data-type="datetime">Latest snapshot</th>
            </tr>
            </thead>
            <tbody>
            <!--/* The whole row opens the branch (app.js, mouse and Enter); the repo URL is a separate external link. */-->
            <tr th:each="b : ${branches}" th:with="href=@{/repos/{id}(id=${b.id()})},appId=${appIds.get(b.id())}" th:attr="data-href=${href}">
                <td data-column="appid" th:text="${appId ?: '—'}">APP-1</td>
                <td data-column="repo" class="col-source"><a th:if="${b.repoLink()}" th:href="${b.repoLink()}" th:text="${b.repoUrl()}"
                        rel="noopener noreferrer">url</a><span th:unless="${b.repoLink()}" th:text="${b.repoUrl()}">url</span></td>
                <td data-column="branch"><span th:text="${b.branch()}">main</span>
                    <noscript><a th:href="${href}">Details</a></noscript></td>
                <td data-column="provider" th:text="${b.provider()}">gitlab</td>
                <td data-column="packages" class="num" th:text="${b.depCount()}">5</td>
                <td data-column="snapshot" class="date small" th:attr="data-value=${b.observedAt() != null} ? ${@view.time(b.observedAt())} : ''" th:text="${b.observedAt() != null} ? ${@view.time(b.observedAt())} : 'No snapshot yet'">time</td>
            </tr>
            <tr th:if="${branches.isEmpty()}">
                <td colspan="6" class="empty">No code repos yet. <a th:href="@{/imports}">Import a CSV or JSON</a>.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
