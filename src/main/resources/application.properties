spring.application.name=EoL Ledger

# Local single-operator tool: bind to loopback only. Override with SERVER_ADDRESS / SERVER_PORT.
server.address=127.0.0.1
server.port=8092

spring.datasource.url=jdbc:h2:file:./data/eol-ledger;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.thymeleaf.cache=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# Time zone used for "today" and "as of day" boundaries (blank = JVM default). Env: EOL_ZONE
eol.zone=

# endoflife.date API (generated from github.com/endoflife-date/endoflife.date). Env: EOL_CATALOG_BASE_URL
eol.catalog.base-url=https://endoflife.date/api/v1
# Blank = whole catalogue via one GET /products/full. Or a comma list, e.g. python,nodejs,spring-boot
eol.catalog.products=
eol.catalog.timeout=60s
eol.catalog.max-bytes=33554432

# Explicit identity->product mappings, e.g. pkg:maven/com.acme/acme-spring-bom=spring-boot
eol.mappings=

# SBOM hosts allowlist (HTTPS). Tokens come from config/env only, never from CSV:
#   EOL_SBOM_HOSTS_0_HOST=artifactory.example.com  EOL_SBOM_HOSTS_0_TOKEN=...
eol.sbom.timeout=30s
eol.sbom.max-bytes=10485760

# Background jobs: disabled by default ("-"). Enable each independently with a cron expression.
eol.jobs.catalog-sync.cron=-
eol.jobs.catalog-sync.zone=UTC
eol.jobs.repo-refresh.cron=-
eol.jobs.repo-refresh.zone=UTC
# CSV re-imported by the repo-refresh job; blank = refresh every registered branch from the stored registry.
eol.refresh-csv-path=
