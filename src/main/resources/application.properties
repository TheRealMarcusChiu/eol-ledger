spring.application.name=EoL Ledger

# Local single-operator tool: bind to loopback only. Override with SERVER_ADDRESS / SERVER_PORT.
server.address=127.0.0.1
server.port=8092

spring.datasource.url=jdbc:h2:file:./data/eol-ledger;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# dependency-inventory JSON carries one row per resolved graph edge
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# Time zone used for "today" and "as of day" boundaries (blank = JVM default). Env: EOL_ZONE
eol.zone=

# endoflife.date API (generated from github.com/endoflife-date/endoflife.date). Env: EOL_CATALOG_BASEURL
eol.catalog.base-url=https://endoflife.date/api/v1
# Catalogue sync always fetches all products via one GET /products/full; products is retained for configuration compatibility.
eol.catalog.products=
eol.catalog.timeout=60s
eol.catalog.max-bytes=33554432

# Explicit identity->product mappings, e.g. pkg:maven/com.acme/acme-spring-bom=spring-boot
eol.mappings=

# Background catalogue sync: disabled by default ("-"). Enable with a cron expression.
eol.jobs.catalog-sync.cron=-
eol.jobs.catalog-sync.zone=UTC
