# External MySQL 8 storage, chosen at startup with SPRING_PROFILES_ACTIVE=mysql. No fallback to H2:
# a missing MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD or an unreachable server stops startup.
# Example: MYSQL_URL=jdbc:mysql://db.example.com:3306/eol_ledger?sslMode=VERIFY_IDENTITY
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# create-if-not-exists only; never drops or alters
spring.sql.init.schema-locations=classpath:schema-mysql.sql
# reject over-long values instead of silently truncating them, whatever the server default sql_mode is
spring.datasource.hikari.connection-init-sql=SET SESSION sql_mode = CONCAT_WS(',', NULLIF(@@SESSION.sql_mode, ''), 'STRICT_ALL_TABLES')
