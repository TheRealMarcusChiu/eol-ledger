spring.application.name=EoL Ledger
spring.datasource.url=jdbc:h2:mem:eol;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
logging.level.root=WARN
spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health
server.error.whitelabel.enabled=false
eol.zone=Europe/Amsterdam
# Tests never reach the public internet: catalogue points at an unroutable loopback port unless a test overrides it.
eol.catalog.base-url=http://127.0.0.1:9/api/v1
eol.catalog.timeout=5s
eol.catalog.max-bytes=1000000
eol.sbom.timeout=5s
eol.sbom.max-bytes=100000
eol.sbom.hosts[0].host=127.0.0.1
eol.sbom.hosts[0].token=test-secret-token
eol.sbom.hosts[0].allow-http=true
eol.jobs.catalog-sync.cron=-
eol.jobs.catalog-sync.zone=UTC
eol.jobs.repo-refresh.cron=-
eol.jobs.repo-refresh.zone=UTC
